
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Book Management System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Online Book Management System</h1>
        <p>Manage your books easily</p>
    </header>

    <main>

        <section class="form-section">

            <h2 id="formTitle">Add New Book</h2>

            <form id="bookForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Enter Book Title"
                    required
                >

                <input
                    type="text"
                    id="author"
                    placeholder="Enter Author Name"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Enter Book Price"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit" id="submitBtn">
                    Add Book
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel-btn"
                    hidden
                >
                    Cancel Edit
                </button>

            </form>

        </section>

        <p id="message"></p>

        <section class="books-section">

            <h2>Available Books</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Book ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Price (₹)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="bookList">
                        <!-- Books will appear here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Online Book Management System</p>
    </footer>

</body>
</html>
